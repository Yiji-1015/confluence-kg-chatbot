# =================================================================
# [Search Layer] 검색 엔진 & 인덱스 관리 레이어 (Elasticsearch & Kibana)
# =================================================================
# 역할:
# - Elasticsearch: 한국어 Nori 형태소 분석 (BM25) + 1536차원 Dense Vector (kNN) 하이브리드 검색
# - Kibana: 인덱스 상태 모니터링, 매핑 확인, 검색 쿼리 디버깅
# - es-setup / kibana-setup: TLS 인증서 발급 및 kibana_system 계정 초기화 배치 컨테이너
#
# 실행 방법:
#   docker compose -f docker-compose.yml -f docker-compose.search.yml up -d
#
# 포트:
#   - Elasticsearch: 127.0.0.1:9200 (보안상 로컬 바인딩)
#   - Kibana UI: http://localhost:5601
# =================================================================

services:
  # [1/4] TLS 인증서 발급 부트스트랩 (인증서가 이미 존재하면 재발급 건너뜀)
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: kg-es-setup
    user: "0"
    volumes:
      - ./elasticsearch/certs:/usr/share/elasticsearch/config/certs
    command: >
      bash -c '
        if [ ! -f config/certs/ca/ca.crt ]; then
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip -o config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/elasticsearch/elasticsearch.crt ]; then
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip \
            --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key \
            --name elasticsearch --dns elasticsearch --dns localhost --ip 127.0.0.1;
          unzip -o config/certs/certs.zip -d config/certs;
        fi;
        chmod -R a+r config/certs;
      '

  # [2/4] Elasticsearch 본체 기동 (Nori 플러그인 포함)
  elasticsearch:
    build: ./elasticsearch
    container_name: kg-elasticsearch
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      - node.name=kg-es-01
      - cluster.name=confluence-kg
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-kg-password}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
    mem_limit: 2g
    cpus: 1.0
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch/certs:/usr/share/elasticsearch/config/certs
    healthcheck:
      test: >
        curl -s --cacert config/certs/ca/ca.crt
        -u elastic:${ELASTIC_PASSWORD:-kg-password}
        "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        | grep -q '"status":"yellow"\|"status":"green"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: on-failure:3

  # [3/4] kibana_system 계정 비밀번호 설정 (Kibana 연결 전용)
  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: kg-kibana-setup
    volumes:
      - ./elasticsearch/certs:/certs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      curl -s -X POST --cacert /certs/ca/ca.crt
      -u elastic:${ELASTIC_PASSWORD:-kg-password}
      -H "Content-Type: application/json"
      https://elasticsearch:9200/_security/user/kibana_system/_password
      -d "{\"password\":\"${KIBANA_PASSWORD:-kg-password}\"}"

  # [4/4] Kibana 대시보드 UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kg-kibana
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-kg-password}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt
    ports:
      - "5601:5601"
    volumes:
      - ./elasticsearch/certs:/usr/share/kibana/config/certs:ro
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 0.75
    restart: on-failure:3

volumes:
  es_data:

networks:
  default:
    name: confluence-net
