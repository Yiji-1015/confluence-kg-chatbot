server:
  port: 8080

spring:
  application:
    name: confluence-rag-chatbot-backend

  # 1. PostgreSQL 데이터베이스 연결 설정 (docker-compose rag-postgres:5432)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chatbot_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # 2. 스키마는 Flyway가 만든다 (db/migration). Hibernate는 검증만 한다.
  #    validate는 엔티티와 실제 테이블이 어긋나면 기동 자체를 막는다.
  #    update였을 때는 어긋나도 조용히 넘어가거나 되돌릴 수 없는 변경이 들어갔다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 개발 DB에는 ddl-auto: update가 만들어 둔 테이블이 이미 있다. 이력 테이블이 없는
    # 채로 비어 있지 않은 스키마를 만나면 Flyway는 기동을 막는다("Found non-empty schema").
    # baseline-version을 0으로 두는 것이 핵심이다. 기본값 1이면 V1이 "이미 적용된 것"으로
    # 간주돼 건너뛰고, V1이 함께 만드는 인덱스가 기존 DB에는 생기지 않는다.
    # 0이면 V1이 실제로 실행되고, 테이블은 IF NOT EXISTS라 그대로, 인덱스만 새로 생긴다.
    # 새 DB에서는 스키마가 비어 있으므로 이 설정과 무관하게 V1부터 정상 실행된다.
    baseline-on-migrate: true
    baseline-version: 0

  # 3. JPA & Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  # 3. Redis 연결 설정 (docker-compose rag-redis:6379, 세션 및 캐시)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  # 4. HTTP 클라이언트 공통 설정 (자동 구성된 RestClient.Builder에 적용된다)
  # LLM 답변 생성을 기다려야 해서 읽기 타임아웃이 길다. 현재 이 앱의 유일한 외부 호출은
  # ai-server 하나뿐이라 전역으로 둔다. 클라이언트가 늘면 그때 분리해야 한다.
  http:
    clients:
      connect-timeout: 10s
      read-timeout: ${AI_ENGINE_TIMEOUT:60s}
      imperative:
        # 전송 구현을 JDK HttpClient(Boot 4 기본)로 두면 ai-server 호출이 깨진다.
        # JDK HttpClient는 HTTP/2가 기본이라 평문 연결에서 h2c 업그레이드를 시도하는데,
        # ai-server의 uvicorn(h11)은 HTTP/1.1 전용이라 업그레이드를 거절하면서 본문을 잃는다.
        # 결과는 422 "body: Field required, input: null"이고, uvicorn 로그에는
        # "Unsupported upgrade request"가 남는다.
        # simple = SimpleClientHttpRequestFactory(HttpURLConnection). HTTP/1.1만 쓴다.
        factory: simple

# Python AI Engine (ai-server:8000) 연동 설정
# 타임아웃은 위 spring.http.clients로 옮겼다.
ai-engine:
  base-url: ${AI_ENGINE_URL:http://localhost:8000}

# Actuator: 내부 관측용 엔드포인트만 연다. 그 외(env, beans, heapdump 등)는 설정·자격 정보가
# 새어나갈 수 있어 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      # 여러 서비스 지표가 한 Prometheus에 모이므로 어느 서비스인지 라벨로 구분한다.
      application: ${spring.application.name}
    distribution:
      # Micrometer 기본 출력은 summary(_count/_sum/_max)라 _bucket 시계열이 없다.
      # 그래서 대시보드의 histogram_quantile(..._bucket) 패널이 전부 No data였다.
      # p95를 보려면 히스토그램을 켜야 한다. (ai-server는 파이썬 prometheus_client가
      # 히스토그램을 기본으로 내보내서 04번 대시보드만 멀쩡했다.)
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      # 버킷 수를 기대 범위로 제한한다. 지정하지 않으면 버킷이 수십 개씩 붙어
      # (uri × method × status × outcome) 조합마다 곱해진다.
      minimum-expected-value:
        http.server.requests: 10ms
        http.client.requests: 100ms
      maximum-expected-value:
        http.server.requests: 10s
        # AI 호출은 LLM 생성을 기다리므로 상한이 길다. read-timeout(60s)에 맞춘다.
        http.client.requests: 60s
  observations:
    key-values:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

