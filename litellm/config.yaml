# LiteLLM 게이트웨이 설정
# 하나의 OpenAI 호환 API(http://localhost:4000)로 여러 모델 제공
# 모델 전환/폴백을 코드 수정 없이 이 파일로만 제어

model_list:
  - model_name: deepseek-chat          # Python/Spring에서 호출할 이름
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # 사내 임베딩 API를 OpenAI 호환 스키마로 등록 (BGE-M3)
  - model_name: embedding-internal
    litellm_params:
      model: openai/text-embedding-3-small   # OpenAI 호환 스키마 (실제 모델 아님)
      api_base: os.environ/EMBEDDING_API_URL
      api_key: dummy
