# LiteLLM 게이트웨이 설정
# 하나의 OpenAI 호환 API(http://localhost:4000)로 여러 모델 제공
# 모델 전환/폴백을 코드 수정 없이 이 파일로만 제어

model_list:
  - model_name: deepseek-chat          # Python/Spring에서 호출할 이름
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # 상위 추론 모델 (짧은 모호 질문 또는 1000자 이상 복잡 컨텍스트용)
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # 평가 전용 판정 모델 (Upstage). 답변 생성 모델과 다른 계열을 써서
  # 같은 모델이 자기 답을 채점하는 self-preference bias를 제거한다.
  # Upstage는 OpenAI 호환 API라 openai/ 프리픽스 + api_base로 붙인다.
  - model_name: solar-judge
    litellm_params:
      model: openai/solar-pro4
      api_base: https://api.upstage.ai/v1
      api_key: os.environ/UPSTAGE_API_KEY

  # 임베딩은 폴백하지 않음 — 벡터 공간이 달라지면 재색인이 필요 (PLAN §5)
  - model_name: embedding-openai
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

# Phase 3: LLM 게이트웨이 Fallback 라우팅 규칙
router_settings:
  fallbacks:
    - deepseek-chat: ["gpt-4o-mini"]   # DeepSeek API 장애 시 GPT-4o-mini로 자동 폴백
    - gpt-4o: ["deepseek-chat"]        # GPT-4o 장애 시 DeepSeek으로 자동 폴백
  # solar-judge는 의도적으로 폴백을 두지 않는다. 판정자가 조용히 gpt-4o로 넘어가면
  # 생성 모델이 자기 답을 채점하게 되어, 분리해둔 의미가 사라진다. 차라리 실패시킨다.

# Phase 3: Langfuse 실시간 옵저버빌리티/트레이싱 자동 전송
litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

