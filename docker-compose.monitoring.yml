# 모니터링 계층. 이 파일을 빼고 실행하면 서비스는 그대로 동작하고 관측만 없어진다.
#
# 컨테이너 3개를 새로 추가한 이유:
# - prometheus: 시계열 저장소. 앱이 내는 /metrics를 주기적으로 긁어 보관한다.
# - grafana: 대시보드. provisioning으로 데이터소스·대시보드를 코드에서 올린다.
# - cadvisor: 컨테이너 자원(CPU/메모리/네트워크/디스크). 서비스별 exporter를 각각
#   붙이는 대신 하나로 전체 컨테이너를 덮는다.
#
# 이미 있는 Elasticsearch + Kibana에 메트릭을 넣는 방법도 검토했으나 택하지 않았다.
# ES는 mem_limit 2g로 RAG 검색을 담당하는 컴포넌트다. 거기에 메트릭 색인까지 얹으면
# 감시 대상이 감시 비용을 부담하게 되어, 부하가 오를수록 관측이 함께 흔들린다.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rag-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 로컬 개발 환경이므로 보관 기간을 짧게 잡아 디스크를 아낀다.
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # 리눅스에서는 host.docker.internal이 자동으로 생기지 않는다. 이 항목이 없으면
    # 스크레이프 타겟의 DNS 조회가 실패한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 512m
    restart: on-failure:3

  grafana:
    image: grafana/grafana:11.2.0
    container_name: rag-grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # 로컬 관측용이므로 가입·익명 접근을 막는다.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # 패널 이미지 렌더링을 아래 renderer 컨테이너에 위임한다.
      # Grafana 본체에는 브라우저가 없어 /render 요청을 스스로 처리하지 못한다.
      - GF_RENDERING_SERVER_URL=http://grafana-image-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    restart: on-failure:3

  # 대시보드·패널을 PNG로 뽑는다. 문서에 붙일 이미지, 알림에 첨부할 그래프에 쓴다.
  # 없어도 Grafana는 정상 동작한다. 화면에서 보는 데는 필요 없고 이미지 추출에만 쓰인다.
  grafana-image-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: rag-grafana-renderer
    environment:
      - RENDERING_MODE=default
    expose:
      - "8081"
    mem_limit: 512m
    restart: on-failure:3

  cadvisor:
    # 버전이 두 번 문제가 됐다. 둘 다 증상이 "타겟은 UP인데 05번 대시보드가 통째로 빔"이라
    # 눈치채기 어려웠다.
    #
    # 1) v0.49.1: Docker API 클라이언트가 1.41이라 최신 데몬(최소 1.44)에 거절당한다.
    #      "Registration of the docker container factory failed: client version 1.41 is too old"
    #
    # 2) v0.52.1: 이 호스트의 Docker가 containerd 이미지 저장소를 쓴다는 것이 문제였다.
    #      docker info -> Storage Driver: overlayfs / driver-type: io.containerd.snapshotter.v1
    #    이 방식에서는 /var/lib/docker/image/ 디렉터리 자체가 없다. 레이어를 containerd가
    #    관리하기 때문이다. 그런데 cAdvisor의 Docker 팩토리는 컨테이너마다
    #    /var/lib/docker/image/<driver>/layerdb/mounts/<id>/mount-id 에서 RW 레이어를 찾는다.
    #      "failed to identify the read-write layer ID ... layerdb/mounts/...: no such file"
    #    이 실패로 모든 컨테이너 등록이 무산되어 name 라벨이 붙지 않는다.
    #
    #    --disable_metrics=disk 로는 막히지 않는다. 실패 지점이 디스크 수집이 아니라
    #    컨테이너 등록(manager.go:1116)이기 때문이다. 실제로 끈 상태에서도 계속 실패했다.
    #
    # v0.55.1에서 해결된다 (2026-09-14 실측: name="rag-*" 시계열 11건, 등록 실패 0건).
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: rag-cadvisor
    # 디스크 지표는 계속 끈다. v0.55.1에서 레이어 조회는 성공하지만 containerd 저장소에서는
    # container_fs_usage_bytes가 여전히 나오지 않는다(2026-09-14 확인). 켜도 얻는 것이 없다.
    # 여기서 보려는 것은 CPU·메모리·네트워크다.
    command:
      - --docker_only=true
      - --disable_metrics=disk,diskIO,advtcp,tcp,udp,sched,process,hugetlb,referenced_memory,resctrl
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # cAdvisor 기본 포트는 8080이라 backend와 겹친다. 호스트로는 노출하지 않고
    # Prometheus가 컨테이너 네트워크 안에서만 접근한다.
    expose:
      - "8080"
    mem_limit: 384m
    restart: on-failure:3

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: confluence-net
