# =================================================================
# [KG Layer] 지식 그래프 레이어 (Neo4j Graph Database)
# =================================================================
# 역할:
# - Neo4j: Confluence 문서 간의 링크 관계, 엔터티, 조상-자식 계층을 그래프로 저장
# - GraphRAG: 복합 관계 질의 및 멀티홉 지식 탐색
#
# 실행 방법:
#   docker compose -f docker-compose.yml -f docker-compose.kg.yml up -d
#
# 포트:
#   - 7474: Neo4j Browser 웹 대시보드
#   - 7687: Bolt 프로토콜 (FastAPI neo4j 드라이버 연결)
# =================================================================

services:
  neo4j:
    image: neo4j:5-community
    container_name: kg-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-kg-password}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    mem_limit: 2g
    volumes:
      - neo4j_data:/data
    restart: on-failure:3

volumes:
  neo4j_data:

networks:
  default:
    name: confluence-net
