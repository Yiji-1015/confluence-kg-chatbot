# =================================================================
# [App Layer] 애플리케이션 서비스 레이어 (Spring Boot & FastAPI)
# =================================================================
# 역할:
# - backend (Spring Boot): 대화 세션 관리, RDB/Redis 오케스트레이션, 챗봇 Web UI
# - ai-server (FastAPI): Hybrid Retrieval, Model Routing, RAG 파이프라인
#
# 실행 방법 (Core와 함께 컨테이너 구동 시):
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
#
# 로컬 개발 시:
#   호스트에서 ./gradlew bootRun 및 uvicorn 실행 (docker-compose.app.yml 불필요)
# =================================================================

services:
  ai-server:
    build: ./ai-server
    container_name: rag-ai-server
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Confluence RAG Chatbot - AI Engine
      - DEBUG=true
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://litellm:4000}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-https://elasticsearch:9200}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-${ELASTIC_PASSWORD:-rag-password}}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-rag-password}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-5}
      - RETRIEVAL_CANDIDATE_SIZE=${RETRIEVAL_CANDIDATE_SIZE:-50}
      - DOC_CONTEXT_MAX_CHARS=${DOC_CONTEXT_MAX_CHARS:-3000}
      - HYBRID_BM25_WEIGHT=${HYBRID_BM25_WEIGHT:-4}
      - HYBRID_KNN_WEIGHT=${HYBRID_KNN_WEIGHT:-6}
      - RECENCY_BOOST_MAX=${RECENCY_BOOST_MAX:-0.04}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - JUDGE_MODEL=${JUDGE_MODEL:-solar-judge}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - CONFLUENCE_BASE_URL=${CONFLUENCE_BASE_URL}
      - CONFLUENCE_SPACE_KEY=${CONFLUENCE_SPACE_KEY}
      - CONFLUENCE_EMAIL=${CONFLUENCE_EMAIL}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}
    volumes:
      - ./ai-server/app:/app/app:ro
      - ./ai-server/scripts:/app/scripts:ro
      - ./ai-server/evaluation:/app/evaluation:ro
      # 평가 의존성 목록. 이미지에는 없고(서빙에 불필요) 평가 실행 시에만 설치한다.
      - ./ai-server/requirements-eval.txt:/app/requirements-eval.txt:ro
      - ./elasticsearch/certs:/app/elasticsearch/certs:ro
      - ./.env:/app/.env:ro
    mem_limit: 1g
    restart: on-failure:3

  backend:
    build: ./backend
    container_name: rag-backend
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-chatbot_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_ENGINE_URL=http://ai-server:8000
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    restart: on-failure:3

networks:
  default:
    name: confluence-net
