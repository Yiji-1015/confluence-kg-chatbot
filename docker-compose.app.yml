# =================================================================
# [App Layer] 애플리케이션 서비스 레이어 (Spring Boot & FastAPI)
# =================================================================
# 역할:
# - backend (Spring Boot): 대화 세션 관리, RDB/Redis 오케스트레이션, 챗봇 Web UI
# - ai-server (FastAPI): Hybrid Retrieval, Model Routing, RAG 파이프라인
#
# 실행 방법 (Core와 함께 컨테이너 구동 시):
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
#
# 로컬 개발 시:
#   호스트에서 ./gradlew bootRun 및 uvicorn 실행 (docker-compose.app.yml 불필요)
# =================================================================

services:
  ai-server:
    build: ./ai-server
    container_name: kg-ai-server
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Confluence KG Chatbot - AI Engine
      - DEBUG=true
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://litellm:4000}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-https://elasticsearch:9200}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-${ELASTIC_PASSWORD:-kg-password}}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-kg-password}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - CONFLUENCE_BASE_URL=${CONFLUENCE_BASE_URL}
      - CONFLUENCE_SPACE_KEY=${CONFLUENCE_SPACE_KEY}
      - CONFLUENCE_EMAIL=${CONFLUENCE_EMAIL}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}
    volumes:
      - ./ai-server/app:/app/app:ro
      - ./ai-server/scripts:/app/scripts:ro
      - ./ai-server/evaluation:/app/evaluation:ro
      - ./elasticsearch/certs:/app/elasticsearch/certs:ro
      - ./.env:/app/.env:ro
    depends_on:
      - redis
    mem_limit: 1g
    restart: on-failure:3

  backend:
    build: ./backend
    container_name: kg-backend
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-chatbot_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_ENGINE_URL=http://ai-server:8000
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    restart: on-failure:3

networks:
  default:
    name: confluence-net
