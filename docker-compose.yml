# =================================================================
# [Core Layer] 데이터베이스 & 세션 캐시 레이어 (기본 필수 실행)
# =================================================================
# 역할:
# - PostgreSQL: 대화방 세션 및 메시지 이력 영구 저장 (RDB)
# - Redis: 최근 5턴 대화 맥락 캐싱 (TTL 30분) 및 세션 캐시
#
# 실행 방법:
#   docker compose up -d
# =================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chatbot_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chatbot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: on-failure:3

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    restart: on-failure:3

volumes:
  pg_data:

networks:
  default:
    name: confluence-net
