# 데이터소스를 코드로 관리한다. UI에서 손으로 추가하면 컨테이너를 다시 만들 때 사라진다.
apiVersion: 1
datasources:
  - name: Prometheus
    # uid를 고정한다. 지정하지 않으면 Grafana가 임의 문자열(PBFA97CFB590B2093 같은)을
    # 만들어 붙이는데, 대시보드 JSON은 "prometheus"를 가리키고 있어 서로 어긋난다.
    # 그러면 모든 패널이 "No data"로 뜬다. 데이터소스도 Prometheus도 멀쩡한데,
    # 패널이 존재하지 않는 데이터소스를 조회하기 때문이다.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
