# Prometheus 스크레이프 설정.
#
# 타겟 주소에 대해: ai-server와 backend는 컨테이너 이름(`backend:8080`)이 아니라
# `host.docker.internal`로 긁는다. 두 서비스는 개발 중 컨테이너로도 돌고 호스트에서
# 직접도(`./gradlew bootRun`, `uvicorn`) 도는데, 컨테이너 이름으로 긁으면 호스트 실행일 때
# DNS 조회부터 실패해 타겟이 DOWN이 된다. 실행 방식을 바꿀 때마다 이 파일을 고치게 된다.
#
# 두 서비스 모두 포트를 호스트로 퍼블리시하므로(8080:8080, 8000:8000) 호스트 주소로
# 긁으면 컨테이너 모드에서는 포트 포워딩을 타고 컨테이너에 닿고, 호스트 모드에서는
# 프로세스에 직접 닿는다. 한 주소로 두 경우가 다 해결된다.
#
# 덤으로 `instance` 라벨이 모드에 따라 바뀌지 않는다. 주소를 갈아끼우는 방식이었다면
# 모드를 바꿀 때마다 라벨이 달라져 Grafana에서 시계열이 끊겨 보인다.
#
# 이 방식은 포트 퍼블리시에 의존한다. 외부 배포 때 포트를 닫고 컨테이너 네트워크
# 안에서만 통신하게 바꾼다면 타겟도 컨테이너 이름으로 되돌려야 한다.
# cadvisor는 호스트로 노출하지 않으므로(expose만) 컨테이너 이름을 그대로 쓴다.
#
# 지표를 내는 주체는 애플리케이션 자신(ai-server /metrics, backend /actuator/prometheus)과
# cAdvisor 하나뿐이다. postgres/redis/elasticsearch 전용 exporter는 두지 않았다.
# 운영 판단에 필요한 것은 "DB 서버 내부 수치"가 아니라 "우리 앱이 DB를 쓸 때 겪는 지연과
# 커넥션 고갈"이고, 그것은 Actuator의 HikariCP 지표와 앱에서 측정한 단계별 지연으로 이미
# 나온다. exporter를 붙이면 컨테이너 3개가 늘고 대부분 안 보는 패널이 된다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: confluence-rag

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # AI 엔진: RAG 단계별 지연(embedding/search/context_build/generation), 요청 수·에러율,
  # 검색 문서 수, 모델 라우팅 분포, 파이썬 프로세스 지표
  - job_name: ai-server
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # 백엔드: HTTP 지연·에러율(http_server_requests), AI 엔진 호출 지연(http_client_requests),
  # HikariCP 커넥션 풀, JVM 힙·GC·스레드, 대화 이력 캐시 적중률
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # 컨테이너 자원: CPU, 메모리, 네트워크, 디스크. 서비스별 전용 exporter 없이
  # 모든 컨테이너를 한 곳에서 덮는다.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
